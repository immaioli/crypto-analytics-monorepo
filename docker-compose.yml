version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: crypto_web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      # Redirecionamos a variável do Frontend para buscar o backend direto pela porta local ou proxy
      # No docker-compose local, pode ser a API interna. Mas em prod, deve ser o IP público ou proxy.
      # Usaremos caminho relativo (/) para bater no nginx e ele rotear pro /api.
      - NEXT_PUBLIC_API_URL=/api
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: crypto_api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: crypto_redis
    restart: unless-stopped
    # Expor porta externa apenas para debug local (remova em PRD estrito)
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning

  neo4j:
    image: neo4j:5-community
    container_name: crypto_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-dashboard-cripto}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  nginx:
    image: nginx:alpine
    container_name: crypto_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api

volumes:
  redis_data:
  neo4j_data:
  neo4j_logs: