name: Keep API Awake

on:
  schedule:
    # Render sleeps after 15 minutes of inactivity. We ping every 10 minutes.
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API Health Endpoint
        run: |
          # Use HEAD request so we do not download body, just verify 200 OK.
          curl -I -s --fail https://api-dashboard-cripto.onrender.com/health || echo "Ping failed, but workflow continues."